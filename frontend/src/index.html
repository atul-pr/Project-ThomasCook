<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AtulStays — Curated Luxury &amp; Business Stays Across India</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('atulstays-theme') || localStorage.getItem('stayatlas-theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'dark' || (pref === 'system' && prefersDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
